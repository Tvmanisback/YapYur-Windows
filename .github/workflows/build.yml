name: Build YapYur Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply YapYur branding to packaged UI
        shell: pwsh
        run: |
          $roots = @("src", "themes")
          $extensions = @(".js", ".html", ".css", ".json", ".md")
          foreach ($root in $roots) {
            Get-ChildItem $root -Recurse -File | Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() } | ForEach-Object {
              $file = $_.FullName
              $text = [System.IO.File]::ReadAllText($file)
              $text = $text -creplace "YapCord", "YapYur"
              $text = $text -creplace "yapcord", "yapyur"
              $text = $text -creplace "dev\.yapcord\.app", "tvman.unknown.yapyur"
              [System.IO.File]::WriteAllText($file, $text, [System.Text.UTF8Encoding]::new($false))
            }
          }

      - name: Generate Windows application icon from SVG
        run: |
          npm install --no-save sharp png-to-ico
          node --input-type=module -e "import sharp from 'sharp'; import pngToIcoModule from 'png-to-ico'; import { writeFile } from 'node:fs/promises'; const pngToIco = pngToIcoModule.default ?? pngToIcoModule; await sharp('build/icon.svg').resize(256, 256).png().toFile('build/icon.png'); await writeFile('build/icon.ico', await pngToIco('build/icon.png'));"

      - name: Download and integrate plugins from the YapYur ZIP source
        shell: pwsh
        run: |
          $extensionZip = "YapYur-extension.zip"
          $extensionDir = "yapyur-extension-source"
          $pluginUrl = "https://github.com/Tvmanisback/yapyur-download/releases/download/1.10.3/YapYur-extension.zip"
          Invoke-WebRequest -Uri $pluginUrl -OutFile $extensionZip
          Expand-Archive -Path $extensionZip -DestinationPath $extensionDir -Force
          Copy-Item (Join-Path $extensionDir "content.js") "src/main/yapyur-plugins.js" -Force
          $pluginSource = [System.IO.File]::ReadAllText("src/main/yapyur-plugins.js")
          $pluginSource = $pluginSource.Replace("window.YapperMod = YM;", "window.YapYurPlugins = YM;")
          $pluginSource = $pluginSource.Replace("YM.mode = 'bookmarklet';", "YM.mode = 'desktop';")
          $pluginSource = $pluginSource.Replace("ym-", "yyx-")
          $pluginSource = $pluginSource.Replace("if (!def || !def.name) return null;", "if (!def || !def.name) return null;`n    if (def.name === 'MessageLogger' || def.name === 'BetterFolders') return null;")
          [System.IO.File]::WriteAllText("src/main/yapyur-plugins.js", $pluginSource, [System.Text.UTF8Encoding]::new($false))
          Remove-Item $extensionZip -Force
          Remove-Item $extensionDir -Recurse -Force

      - name: Build portable EXE
        run: npm run dist

      - name: Capture YapYur UI screenshot
        shell: pwsh
        run: |
          npm install --no-save playwright
          node tools/capture-ui.cjs

      - name: Assemble release folder
        shell: pwsh
        run: |
          $releaseDir = "YapYur-Release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $exe = Get-ChildItem "dist" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "No portable EXE was created in dist/" }
          Copy-Item $exe.FullName (Join-Path $releaseDir $exe.Name) -Force
          $screenshot = Join-Path $releaseDir "ui screen shots/YapYur.png"
          if (-not (Test-Path $screenshot)) { throw "UI screenshot missing: $screenshot" }

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: YapYur-Windows-Release
          path: YapYur-Release/
          if-no-files-found: error
          retention-days: 14
