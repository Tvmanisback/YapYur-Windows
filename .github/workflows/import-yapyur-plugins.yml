name: Import YapYur ZIP plugins into source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-yapyur-plugins.yml"
      - "tools/import-yapyur-plugins.cjs"

permissions:
  contents: write

jobs:
  import-source-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the YapYur extension source ZIP
        shell: bash
        run: |
          mkdir -p yapyur-extension-source
          curl --fail --location --retry 3 \
            "https://github.com/Tvmanisback/yapyur-download/releases/download/1.10.3/YapYur-extension.zip" \
            --output /tmp/YapYur-extension.zip
          unzip -p /tmp/YapYur-extension.zip content.js > yapyur-extension-source/content.js
          test -s yapyur-extension-source/content.js

      - name: Split plugins into standalone renderer source files
        run: node tools/import-yapyur-plugins.cjs yapyur-extension-source/content.js

      - name: Commit imported plugin files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/plugins/YapYurZip-*.js
          if git diff --cached --quiet; then
            echo "No new or changed plugin source files."
          else
            git commit -m "Import YapYur ZIP plugins as separate source files"
            git push
          fi
