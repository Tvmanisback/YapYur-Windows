name: Split YapYur ZIP plugins
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Split the pinned YapYur v1.10.3 plugin source into separate files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Tvmanisback/yapyur-download/1.10.3/UserScript/YapYur.user.js" -o /tmp/YapYur.user.js
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/YapYur.user.js', 'utf8');
          const starts = [...source.matchAll(/YM\.definePlugin\(\{/g)].map(m => m.index);
          if (starts.length !== 117) throw new Error('Expected 117 plugin definitions; found ' + starts.length);
          const output = 'src/renderer/plugins';
          fs.rmSync(output, { recursive: true, force: true });
          fs.mkdirSync(output, { recursive: true });
          const names = new Set();
          for (let i = 0; i < starts.length; i++) {
            const start = starts[i];
            let chunk, end;
            if (i < 2) {
              const begin = source.lastIndexOf('(function () {', start);
              end = source.indexOf('})();', start);
              if (begin < 0 || end < 0) throw new Error('Cannot isolate plugin wrapper ' + i);
              end += '})();'.length;
              chunk = source.slice(begin, end);
            } else {
              end = source.indexOf('\n  });', start);
              if (end < 0) throw new Error('Cannot isolate plugin at ' + start);
              end += '\n  });'.length;
              chunk = source.slice(start, end);
            }
            const match = chunk.match(/name:\s*['"]([^'"]+)['"]/);
            if (!match) throw new Error('Plugin name missing at ' + i);
            const name = match[1];
            if (names.has(name)) throw new Error('Duplicate plugin ' + name);
            names.add(name);
            fs.writeFileSync(output + '/' + name + '.js',
              '/* YapYur v1.10.3 ZIP plugin */\nconst dom = YM.dom;\nconst util = YM.util;\n' + chunk + '\n');
          }
          console.log('Generated ' + names.size + ' plugin files.');
          NODE
          git add -A src/renderer/plugins
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace plugins with separate YapYur ZIP plugins"
          git push
